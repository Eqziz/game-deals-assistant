name: Release checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gamedeals
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only@localhost:5432/gamedeals
      TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/gamedeals
      SESSION_SECRET: local-ci-secret-long-enough-for-smoke-testing
      PUBLIC_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m app.db
      - run: python -m pytest -q
        env:
          PUBLIC_BASE_URL: https://testserver
      - run: node --check app/static/script.js
      - name: Verify container startup and readiness
        run: |
          docker build -t game-deals:ci .
          docker run -d --name game-deals-ci --network host -e DATABASE_URL -e SESSION_SECRET -e PUBLIC_BASE_URL game-deals:ci
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 http://localhost:8000/api/ready
          curl --fail --silent http://localhost:8000/ > /dev/null
      - name: Check catalog interactions and responsive layouts in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          BROWSER_CHANNEL=chromium python tests/browser_smoke.py http://localhost:8000
      - name: Container logs
        if: failure()
        run: docker logs game-deals-ci || true
