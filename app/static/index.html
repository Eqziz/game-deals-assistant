<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafbf8" />
    <title>Game Deals Assistant</title>
    <link rel="icon" href="/static/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script defer src="/static/script.js"></script>
  </head>
  <body>
    <a class="skip" href="#main" data-t="skip">К содержанию</a>
    <header>
      <div class="wrap mast">
        <a class="brand" href="#deals"
          ><img src="/static/mark.svg" width="32" height="32" alt="" />Game
          Deals Assistant</a
        >
        <div class="account">
          <button id="language" type="button">EN</button
          ><span id="identity"></span
          ><button id="account" type="button" data-t="login">
            Войти через Google
          </button>
        </div>
      </div>
    </header>
    <nav class="wrap nav">
      <a href="#deals" data-t="catalog">Каталог</a
      ><a href="#favorites" data-t="favorites">Избранное</a
      ><a href="#library" data-t="library">Библиотека</a
      ><a href="#profiles" data-t="profiles">Мои профили</a>
    </nav>
    <main id="main" class="wrap" tabindex="-1">
      <div id="notice" role="alert" hidden>
        <span></span><button type="button" data-t="close">Закрыть</button>
      </div>
      <section id="deals">
        <h1 data-t="deals">Скидки на игры</h1>
        <form id="filters">
          <div class="toolbar">
            <label class="search"
              ><span class="sr" data-t="search">Поиск по названию</span
              ><input
                id="query"
                type="search"
                data-placeholder="search"
                placeholder="Поиск по названию"
                maxlength="200"
            /></label>
            <label class="control"
              ><span class="sr" data-t="store">Магазин</span
              ><select id="store">
                <option value="" data-t="allStores">Все магазины</option>
                <option value="steam">Steam</option>
                <option value="gog">GOG</option>
                <option value="epic">Epic Games Store</option>
              </select></label
            >
            <button
              type="button"
              id="toggleFilters"
              aria-expanded="false"
              aria-controls="advanced"
              data-t="filters"
            >
              Фильтры
            </button>
            <button class="primary" data-t="find">Найти</button>
          </div>
          <div id="advanced" hidden>
            <label
              ><span data-t="min">Скидка от, %</span
              ><input
                id="min"
                required
                type="number"
                min="0"
                max="100"
                value="10" /></label
            ><label
              ><span data-t="max">Скидка до, %</span
              ><input
                id="max"
                required
                type="number"
                min="0"
                max="100"
                value="100" /></label
            ><label class="check"
              ><input id="owned" type="checkbox" /><span data-t="hideOwned"
                >Скрыть купленные</span
              ></label
            ><button type="button" id="reset" data-t="reset">Сбросить</button>
          </div>
          <div class="presets">
            <button
              type="button"
              data-preset="all"
              aria-pressed="true"
              data-t="all"
            >
              Все скидки</button
            ><button type="button" data-preset="75">75%+</button
            ><button type="button" data-preset="90">90%+</button
            ><button type="button" data-preset="under5" data-t="under5">
              До $5</button
            ><button type="button" data-preset="free" data-t="free">
              Бесплатно
            </button>
          </div>
        </form>
        <div class="result-head">
          <span id="count" aria-live="polite"></span
          ><label
            ><span class="sr" data-t="sort">Сортировка</span
            ><select id="sort">
              <option value="savings" data-t="byDiscount">По скидке</option>
              <option value="low" data-t="low">Сначала дешевле</option>
              <option value="high" data-t="high">Сначала дороже</option>
              <option value="rating" data-t="rating">По рейтингу</option>
              <option value="title" data-t="byTitle">По названию</option>
              <option value="store" data-t="byStore">По магазину</option>
            </select></label
          >
        </div>
        <div id="dealRows"></div>
        <div id="dealStatus" role="status"></div>
        <button id="more" hidden data-t="more">Показать ещё</button>
      </section>
      <section id="favorites" hidden>
        <h1 data-t="favorites">Избранное</h1>
        <div id="favoriteRows"></div>
      </section>
      <section id="library" hidden>
        <h1 data-t="library">Библиотека</h1>
        <div class="personal toolbar">
          <label class="search"
            ><span class="sr" data-t="librarySearch">Поиск в библиотеке</span
            ><input
              type="search"
              id="librarySearch"
              data-placeholder="librarySearch" /></label
          ><label
            ><span class="sr" data-t="platform">Платформа</span
            ><select id="libraryPlatform">
              <option value="" data-t="platforms">Все платформы</option>
            </select></label
          ><button id="openManual" type="button" data-t="addGame">Добавить игру</button>
        </div>
        <div id="libraryRows"></div>
        <div class="personal forms">
          <form id="manualForm">
            <h2 data-t="addGame">Добавить игру</h2>
            <label
              ><span data-t="game">Название игры</span
              ><input name="title" required maxlength="255" /></label
            ><label
              ><span data-t="platform">Платформа</span
              ><select id="manualPlatform" name="platform"></select></label
            ><label
              ><span data-t="appId">App ID (необязательно)</span
              ><input name="platform_game_id" maxlength="200" /></label
            ><label
              ><span data-t="playtime">Сыграно, часов</span
              ><input name="hours" type="number" min="0" step="0.1" /></label
            ><button class="primary" data-t="add">Добавить</button>
            <div class="feedback" role="status"></div>
          </form>
        </div>
      </section>
      <section id="profiles" hidden>
        <h1 data-t="profiles">Мои профили</h1>
        <div id="syncGate"></div>
        <div id="profileRows" class="personal" aria-live="polite" hidden></div>
      </section>
    </main>
    <footer class="wrap policy-links">
      <a href="/static/privacy.html" data-t="privacy">Конфиденциальность</a>
      <a href="/static/terms.html" data-t="terms">Условия использования</a>
    </footer>
    <dialog id="priceDialog" aria-labelledby="dialogTitle">
      <form id="priceForm">
        <h2 id="dialogTitle" data-t="target">Желаемая цена</h2>
        <p id="targetGame"></p>
        <p id="currentPrice"></p>
        <label
          ><span data-t="targetUSD">Желаемая цена, USD</span
          ><input id="targetPrice" type="number" min="0" step="0.01" required
        /></label>
        <div class="feedback" role="alert"></div>
        <div class="dialogActions">
          <button type="button" id="cancel" data-t="cancel">Отмена</button
          ><button class="primary" data-t="save">Сохранить</button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
